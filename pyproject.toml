[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-9router-stt"
version = "0.1.1"
description = "Hermes Agent speech-to-text provider plugin for 9Router (OpenAI Whisper-compatible transcription)"
requires-python = ">=3.9"
dependencies = ["requests"]

[tool.setuptools]
package-dir = {"" = "src"}